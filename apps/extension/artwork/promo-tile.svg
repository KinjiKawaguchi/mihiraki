<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 280">
  <title>Mihiraki — Chrome Web Store small promo tile</title>
  <!-- No text, saturated colors and a filled area, as the store's image guidelines ask. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d3d7c"/>
      <stop offset="1" stop-color="#0f2349"/>
    </linearGradient>
  </defs>
  <rect width="440" height="280" fill="url(#bg)"/>
  <!-- The book of the icon (artwork/mihiraki.svg), enlarged and centred. -->
  <g transform="translate(220 140) scale(3) translate(-48 -48.5)">
    <!-- The two pages of an open book: base on the left, head on the right. -->
    <g fill="#fafafb">
      <path id="page" d="M9 22Q9 18 13 18C25 18 37 18.6 42 20.2Q46.5 21.6 46.5 26.5V79Q45.5 75.8 40.5 75.2C33 74.2 21 73.8 13 73.8Q9 73.8 9 69.8Z"/>
      <use href="#page" transform="matrix(-1 0 0 1 96 0)"/>
    </g>
    <g fill="none" stroke-linecap="round">
      <path stroke="#a0adc2" stroke-width="3" d="M14.5 27H38M14.5 33H33.5M14.5 56H39M14.5 62H34M55.5 27H79M55.5 33H74.5M55.5 56H80M55.5 62H75"/>
    </g>
    <!-- Removed lines on the base page. -->
    <g>
      <rect x="12" y="37.5" width="31.5" height="6.5" rx="2.5" fill="#fcdbde"/>
      <rect x="12" y="45" width="31.5" height="6.5" rx="2.5" fill="#fcdbde"/>
      <g fill="none" stroke-linecap="round">
        <path stroke="#cc0912" stroke-width="2.5" d="M14.5 40.75H18.5M14.5 48.25H18.5"/>
        <path stroke="#ee6062" stroke-width="3" d="M21.5 40.75H40.5M21.5 48.25H36"/>
      </g>
    </g>
    <!-- Added lines on the head page. -->
    <g>
      <rect x="53" y="37.5" width="31.5" height="6.5" rx="2.5" fill="#def4e8"/>
      <rect x="53" y="45" width="31.5" height="6.5" rx="2.5" fill="#def4e8"/>
      <g fill="none" stroke-linecap="round">
        <path stroke="#068d35" stroke-width="2.5" d="M55.5 40.75H59.5M57.5 38.75V42.75M55.5 48.25H59.5M57.5 46.25V50.25"/>
        <path stroke="#45ad6c" stroke-width="3" d="M62.5 40.75H81.5M62.5 48.25H77"/>
      </g>
    </g>  </g>
</svg>
