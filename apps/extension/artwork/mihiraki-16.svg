<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <title>Mihiraki (16px)</title>
  <!-- Drawn on the pixel grid: two pages with one changed line each. -->
  <rect width="16" height="16" rx="3.5" fill="#132b57" shape-rendering="geometricPrecision"/>
  <g fill="#fafafb">
    <rect x="2" y="3" width="5" height="10"/>
    <rect x="9" y="3" width="5" height="10"/>
  </g>
  <g fill="#8e9ab3">
    <rect x="3" y="4" width="3" height="1"/>
    <rect x="3" y="11" width="2" height="1"/>
    <rect x="10" y="4" width="3" height="1"/>
    <rect x="10" y="11" width="2" height="1"/>
  </g>
  <rect x="3" y="7" width="3" height="2" fill="#d93036"/>
  <rect x="10" y="7" width="3" height="2" fill="#1f9d55"/>
</svg>
