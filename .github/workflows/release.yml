name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm zip
      - uses: softprops/action-gh-release@v3
        with:
          files: apps/extension/.output/mihiraki-*-chrome.zip
          fail_on_unmatched_files: true
