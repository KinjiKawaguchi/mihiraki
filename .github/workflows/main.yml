name: Main

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build:extension
      - uses: actions/upload-artifact@v7
        with:
          name: extension-chrome-mv3
          path: apps/extension/.output/chrome-mv3/

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: echo "version=$(pnpm --filter @mihiraki/playground exec playwright --version)" >> "$GITHUB_OUTPUT"
        id: pw-version
      - uses: actions/cache@v6
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}
      - run: pnpm --filter @mihiraki/playground exec playwright install --with-deps chromium-headless-shell
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @mihiraki/playground exec playwright install-deps chromium-headless-shell
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-results
          path: apps/playground/test-results/
