name: "Release PR: update version and changelog"

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # All writes go through RELEASE_PLEASE_TOKEN, so that the release PR and tag trigger the other workflows.
    permissions: {}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Keeps the token so the formatting fix below can be pushed to the release PR branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - uses: $/.github/actions/setup
        if: steps.release.outputs.pr
        with:
          cache: "false"

      - run: pnpm lint:fix
        if: steps.release.outputs.pr

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        if: steps.release.outputs.pr
        with:
          commit_message: "chore: format"
