name: "Release PR: update version and changelog"

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # All writes go through RELEASE_PLEASE_TOKEN, so that the release PR and tag trigger the other
    # workflows. The job runs nothing but release-please: no checkout, no install, so no dependency
    # code ever runs next to that token. (Biome skips .release-please-manifest.json, the one file
    # release-please writes in a format Biome would change.)
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
