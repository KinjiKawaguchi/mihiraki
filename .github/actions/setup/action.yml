name: Setup
description: Install pnpm (version from packageManager), Node and the workspace dependencies

inputs:
  cache:
    description: Reuse the pnpm store cache. Disable in release workflows to rule out cache poisoning.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
        cache: ${{ inputs.cache == 'true' && 'pnpm' || '' }}
    - run: pnpm install --frozen-lockfile
      shell: bash
